  <defs>
    <style>
      /* Шрифт вшитий у файл: SVG, підключений через &lt;img&gt;, зовнішніх
         запитів не робить, тож звичайний link на Google Fonts тут не працює. */
      @font-face {
        font-family: 'Tektur';
